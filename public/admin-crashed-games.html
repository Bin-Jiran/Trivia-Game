<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الألعاب المتعطلة</title>
  <style>
    :root{
      --yellow:#F5C200; --green:#2F9E44; --red:#E8472A; --blue:#2090BB; --orange:#EF6C00; --amber:#C98A00;
      --glass:rgba(20,20,30,0.55); --glass-border:rgba(255,255,255,0.20);
      --font:'Segoe UI', Tahoma, sans-serif;
    }
    *{ box-sizing:border-box; margin:0; padding:0; }
    body{
      min-height:100vh; direction:rtl; color:#fff; font-family:var(--font);
      background-color:var(--yellow);
      background-image:
        radial-gradient(circle at 50% 34%, rgba(255,243,180,0.95), rgba(245,194,0,0) 58%),
        repeating-conic-gradient(from 0deg at 50% 50%, var(--yellow) 0deg, #FFD64A 7.5deg, var(--yellow) 15deg);
      background-attachment:fixed;
      display:flex; justify-content:center; align-items:flex-start;
      padding:18px 14px 40px;
    }
    .wrap{ width:100%; max-width:620px; }
    .glass{
      background:var(--glass);
      -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
      border:1px solid var(--glass-border); border-radius:16px;
      box-shadow:0 6px 20px rgba(0,0,0,0.22);
    }
    .topbar{ position:relative; display:flex; align-items:center; min-height:42px; margin-bottom:18px; }
    .back{
      position:absolute; top:0; left:0; display:inline-flex; align-items:center; gap:6px;
      padding:7px 11px; font-size:13px; font-weight:700; color:#fff; cursor:pointer;
      font-family:var(--font); background:#E8472A; border:1.5px solid #fff; border-radius:16px;
    }
    .back:active{ transform:scale(0.97); }
    .back svg{ width:16px; height:16px; flex:0 0 auto; }
    .page-title{ width:100%; text-align:right; font-size:23px; font-weight:800; color:#000; text-decoration:underline; }

    .search{
      width:100%; padding:12px 14px; border-radius:12px; font-size:15px; font-family:var(--font);
      color:#fff; border:1px solid rgba(255,255,255,0.3); background:rgba(0,0,0,0.25); margin-bottom:10px;
    }
    .search::placeholder{ color:rgba(255,255,255,0.7); }
    .search-hint{ font-size:12.5px; font-weight:700; color:#000; opacity:0.8; margin:-4px 2px 12px; }
    .clear-search{ display:inline-block; margin:-6px 2px 12px; font-size:13px; font-weight:800; color:#000;
      text-decoration:underline; cursor:pointer; }

    .filterbar{ display:flex; gap:8px; margin-bottom:8px; }
    .filterbar:last-of-type{ margin-bottom:14px; }
    .fbtn{ flex:1 1 0; padding:9px 8px; border-radius:10px; border:1.5px solid #fff;
      background:rgba(255,255,255,0.10); color:#fff; font-size:13px; font-weight:800;
      font-family:var(--font); cursor:pointer; text-align:center; }
    .fbtn.active{ background:var(--blue); }
    .fbtn:active{ transform:scale(0.98); }

    .count{ font-size:13px; font-weight:800; color:#000; margin:0 2px 14px; }
    .filter-empty{ padding:34px 16px; text-align:center; font-size:16px; font-weight:800; }

    /* Attempt cards */
    .acard{ padding:16px; margin-bottom:14px; }
    .ahead{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px 14px; flex-wrap:wrap; margin-bottom:10px; }
    .awhen{ font-size:13px; font-weight:700; opacity:0.92; }
    .aids{ font-size:12px; font-weight:700; opacity:0.75; margin-top:2px; }
    .abadges{ display:flex; flex-wrap:wrap; gap:6px; }
    .badge{ font-size:11.5px; font-weight:800; padding:3px 10px; border-radius:999px; border:1.5px solid #fff; white-space:nowrap; }
    .badge-crashed{ background:var(--red); }
    .badge-shutdown{ background:var(--orange); }
    .badge-other{ background:rgba(255,255,255,0.14); }

    .crash-note{ font-size:12.5px; font-weight:700; line-height:1.5; padding:8px 10px; border-radius:9px;
      background:rgba(0,0,0,0.28); border:1px dashed rgba(255,255,255,0.4); margin-bottom:10px; }

    .ameta{ display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12.5px; font-weight:700; opacity:0.9; margin-bottom:10px; }
    .acats{ font-size:13px; font-weight:600; opacity:0.85; margin-bottom:12px; line-height:1.5; }

    .plist{ display:flex; flex-direction:column; gap:7px; }
    .prow{ display:flex; justify-content:space-between; align-items:center; gap:8px;
      padding:8px 11px; border-radius:9px; background:rgba(255,255,255,0.08); }
    .pname{ font-size:13.5px; font-weight:700; }
    .vbadge{ font-size:11px; font-weight:800; padding:3px 9px; border-radius:999px; border:1.5px solid #fff; white-space:nowrap; flex:0 0 auto; }
    .vbadge-left{ background:var(--green); }
    .vbadge-confirmed{ background:var(--red); }
    .vbadge-default{ background:var(--amber); border-style:dashed; }
    .vbadge-none{ background:rgba(255,255,255,0.14); }
    .no-players{ font-size:12.5px; font-weight:700; opacity:0.8; }

    #loading, #denied, #error{ min-height:60vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; }
    #loading .l-txt{ font-weight:700; font-size:16px; }
    #denied .big, #error .big{ font-size:21px; font-weight:800; }
    #denied .sub, #error .sub{ font-size:14px; opacity:0.9; max-width:300px; }
    .statebtn{ padding:10px 22px; font-size:15px; font-weight:700; color:#fff; cursor:pointer; font-family:var(--font); background:var(--blue); border:1.5px solid #fff; border-radius:12px; }
    .spinner{ width:42px; height:42px; border:4px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; animation:spin 0.8s linear infinite; }
    @keyframes spin{ to{ transform:rotate(360deg); } }
  </style>
</head>
<body>

  <!-- LOADING (default) -->
  <div id="loading"><div class="spinner"></div><div class="l-txt">جاري التحميل...</div></div>

  <!-- ACCESS DENIED -->
  <div id="denied" style="display:none;">
    <div class="big">✗ لا تملك صلاحية الدخول</div>
    <div class="sub">يجب تسجيل الدخول بحساب مشرف لعرض هذه الصفحة.</div>
    <button class="statebtn" type="button" onclick="goHome()">العودة للرئيسية</button>
  </div>

  <!-- SERVER ERROR -->
  <div id="error" style="display:none;">
    <div class="big">⚠ تعذّر الاتصال بالخادم</div>
    <div class="sub">حدث خطأ في الاتصال بالخادم. تحقق من الاتصال وحاول مرة أخرى.</div>
    <button class="statebtn" type="button" onclick="init()">إعادة المحاولة</button>
  </div>

  <!-- MAIN -->
  <div id="screen" class="wrap" style="display:none;">
    <div class="topbar">
      <button class="back" type="button" onclick="goDash()" aria-label="رجوع">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span>رجوع</span>
      </button>
      <div class="page-title">الألعاب المتعطلة</div>
    </div>

    <input id="search" class="search" type="text" placeholder="ابحث باسم لاعب أو رقم هاتف..." autocomplete="off">
    <div id="search-clear" class="clear-search" style="display:none;" onclick="clearSearch()">✕ مسح البحث والعودة للقائمة</div>
    <div id="search-hint" class="search-hint">البحث يعرض كل ألعاب هذا اللاعب المشحونة، وليس المتعطلة فقط</div>

    <div id="filters">
      <div class="filterbar" id="type-filterbar">
        <button class="fbtn active" data-type="all" type="button">الكل</button>
        <button class="fbtn" data-type="crashed" type="button">تعطّل</button>
        <button class="fbtn" data-type="server_shutdown" type="button">إعادة نشر</button>
      </div>
      <div class="filterbar" id="date-filterbar">
        <button class="fbtn active" data-date="all" type="button">كل الوقت</button>
        <button class="fbtn" data-date="today" type="button">اليوم</button>
        <button class="fbtn" data-date="week" type="button">هذا الأسبوع</button>
      </div>
    </div>

    <div class="count" id="count"></div>
    <div id="list"></div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    let attempts = [];        // last fetched set (default queue OR search results)
    let searchActive = false;
    let typeFilter = 'all';
    let dateFilter = 'all';

    const PHASE_AR = ['سهل', 'متوسط', 'صعب'];
    const END_REASON_BADGE_CLASS = { crashed: 'badge-crashed', server_shutdown: 'badge-shutdown' };

    function goHome(){ location.href = '/'; }
    function goDash(){ location.href = '/admin.html'; }
    function showOnly(id){
      ['loading','denied','error','screen'].forEach(s=>{
        document.getElementById(s).style.display = (s===id) ? (s==='screen' ? 'block' : 'flex') : 'none';
      });
    }
    function el(tag, cls, text){
      const e = document.createElement(tag);
      if(cls) e.className = cls;
      if(text != null) e.textContent = text;
      return e;
    }
    function fmtWhen(ts){
      try { return new Date(ts).toLocaleString('ar', { dateStyle:'medium', timeStyle:'short' }); }
      catch(e){ return ''; }
    }
    // Asia/Kuwait is UTC+3 year-round, no DST — same convention as the server's
    // own "gamesToday" query (CLAUDE.md). en-CA gives a sortable YYYY-MM-DD.
    function kuwaitYMD(dateInput){
      return new Date(dateInput).toLocaleDateString('en-CA', { timeZone:'Asia/Kuwait' });
    }
    function isToday(ts){ return kuwaitYMD(ts) === kuwaitYMD(new Date()); }
    // "This week" = trailing 7 days including today (Kuwait-local day boundary) --
    // sidesteps picking a Sunday-vs-Monday week start with no spec either way.
    function isThisWeek(ts){
      const todayYMD = kuwaitYMD(new Date());
      const start = new Date(new Date(todayYMD + 'T00:00:00+03:00').getTime() - 6*24*60*60*1000);
      const startYMD = kuwaitYMD(start);
      const d = kuwaitYMD(ts);
      return d >= startYMD && d <= todayYMD;
    }

    function verdictBadge(v){
      if(v === 'left_voluntarily') return { cls:'vbadge-left', text:'خرج بإرادته' };
      if(v === 'was_connected') return { cls:'vbadge-confirmed', text:'كان متصلاً عند التعطل' };
      if(v === 'no_record_refund_default') return { cls:'vbadge-default', text:'لا يوجد سجل خروج — الاسترداد هو الافتراضي' };
      return { cls:'vbadge-none', text:'—' };
    }

    function attemptCard(a){
      const card = el('div', 'acard glass');

      const head = el('div', 'ahead');
      const whenBox = el('div');
      whenBox.appendChild(el('div', 'awhen', fmtWhen(a.created_at)));
      whenBox.appendChild(el('div', 'aids', `الغرفة ${a.room_code} — محاولة #${a.id}`));
      head.appendChild(whenBox);
      const badges = el('div', 'abadges');
      const endBadgeCls = END_REASON_BADGE_CLASS[a.end_reason] || 'badge-other';
      badges.appendChild(el('span', 'badge ' + endBadgeCls, a.end_reason_label));
      head.appendChild(badges);
      card.appendChild(head);

      if(a.eventsUnreliable){
        card.appendChild(el('div', 'crash-note',
          '⚠ الخادم تعطل أثناء هذه اللعبة، لذا قد لا يوجد سجل خروج حتى لو غادر اللاعب فعلاً — غياب السجل لا يعني أن اللاعب كان متصلاً.'));
      }

      const meta = el('div', 'ameta');
      if(a.last_phase_reached != null && PHASE_AR[a.last_phase_reached]){
        meta.appendChild(el('span', null, 'آخر مرحلة: ' + PHASE_AR[a.last_phase_reached]));
      }
      if(a.last_known_question_index != null){
        meta.appendChild(el('span', null, 'آخر سؤال معروف: #' + (a.last_known_question_index + 1)));
      } else {
        meta.appendChild(el('span', null, 'رقم السؤال غير معروف (لا يوجد سجل أحداث)'));
      }
      card.appendChild(meta);

      if(a.categories && a.categories.length){
        card.appendChild(el('div', 'acats', 'الفئات: ' + a.categories.join('، ')));
      }

      const plist = el('div', 'plist');
      if(!a.players.length){
        plist.appendChild(el('div', 'no-players', 'لم يُشحن أي لاعب في هذه المحاولة'));
      } else {
        a.players.forEach(p=>{
          const row = el('div', 'prow');
          row.appendChild(el('span', 'pname', p.name));
          const vb = verdictBadge(p.verdict);
          row.appendChild(el('span', 'vbadge ' + vb.cls, vb.text));
          plist.appendChild(row);
        });
      }
      card.appendChild(plist);

      return card;
    }

    function applyFiltersAndRender(){
      let shown = attempts;
      if(!searchActive){
        if(typeFilter !== 'all') shown = shown.filter(a => a.end_reason === typeFilter);
        if(dateFilter === 'today') shown = shown.filter(a => isToday(a.created_at));
        else if(dateFilter === 'week') shown = shown.filter(a => isThisWeek(a.created_at));
      }
      const list = document.getElementById('list');
      list.innerHTML = '';
      document.getElementById('count').textContent = shown.length
        ? `${shown.length.toLocaleString('ar')} محاولة`
        : '';
      if(!shown.length){
        list.appendChild(el('div', 'filter-empty glass',
          searchActive ? 'لا توجد ألعاب مشحونة لهذا اللاعب' : 'لا توجد ألعاب متعطلة تطابق هذا الفلتر'));
        return;
      }
      shown.forEach(a => list.appendChild(attemptCard(a)));
    }

    document.getElementById('type-filterbar').addEventListener('click', (e)=>{
      const btn = e.target.closest('.fbtn'); if(!btn) return;
      typeFilter = btn.dataset.type;
      [...document.getElementById('type-filterbar').children].forEach(b=> b.classList.toggle('active', b===btn));
      applyFiltersAndRender();
    });
    document.getElementById('date-filterbar').addEventListener('click', (e)=>{
      const btn = e.target.closest('.fbtn'); if(!btn) return;
      dateFilter = btn.dataset.date;
      [...document.getElementById('date-filterbar').children].forEach(b=> b.classList.toggle('active', b===btn));
      applyFiltersAndRender();
    });

    async function fetchAttempts(search){
      const url = '/api/admin/crashed-games' + (search ? ('?search=' + encodeURIComponent(search)) : '');
      const res = await fetch(url, { headers:{ Authorization:'Bearer ' + token } });
      if(res.status === 401 || res.status === 403) return 'denied';
      if(!res.ok) return 'error';
      const d = await res.json().catch(()=> ({}));
      attempts = Array.isArray(d.attempts) ? d.attempts : [];
      return 'ok';
    }

    let searchTimer = null;
    function onSearchInput(){
      clearTimeout(searchTimer);
      searchTimer = setTimeout(async ()=>{
        const term = document.getElementById('search').value.trim();
        if(!term){ clearSearch(); return; }
        searchActive = true;
        document.getElementById('filters').style.display = 'none';
        document.getElementById('search-clear').style.display = 'block';
        document.getElementById('search-hint').style.display = 'none';
        const r = await fetchAttempts(term);
        if(r === 'denied'){ showOnly('denied'); return; }
        if(r !== 'ok'){ showOnly('error'); return; }
        applyFiltersAndRender();
      }, 300);
    }
    async function clearSearch(){
      document.getElementById('search').value = '';
      searchActive = false;
      document.getElementById('filters').style.display = 'block';
      document.getElementById('search-clear').style.display = 'none';
      document.getElementById('search-hint').style.display = 'block';
      const r = await fetchAttempts(null);
      if(r === 'denied'){ showOnly('denied'); return; }
      if(r !== 'ok'){ showOnly('error'); return; }
      applyFiltersAndRender();
    }

    async function init(){
      if(!token){ showOnly('denied'); return; }
      const r = await fetchAttempts(null);
      if(r === 'denied'){ showOnly('denied'); return; }
      if(r !== 'ok'){ showOnly('error'); return; }
      showOnly('screen');
      document.getElementById('search').addEventListener('input', onSearchInput);
      applyFiltersAndRender();
    }
    init();
  </script>
</body>
</html>
