<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الأسئلة المُبلغ عنها</title>
  <style>
    :root{
      --yellow:#F5C200; --green:#2F9E44; --red:#E8472A; --blue:#2090BB; --orange:#EF6C00;
      --glass:rgba(20,20,30,0.55); --glass-border:rgba(255,255,255,0.20);
      --font:'Segoe UI', Tahoma, sans-serif;
    }
    *{ box-sizing:border-box; margin:0; padding:0; }
    body{
      min-height:100vh; direction:rtl; color:#fff; font-family:var(--font);
      background-color:var(--yellow);
      background-image:
        radial-gradient(circle at 50% 34%, rgba(255,243,180,0.95), rgba(245,194,0,0) 58%),
        repeating-conic-gradient(from 0deg at 50% 50%, var(--yellow) 0deg, #FFD64A 7.5deg, var(--yellow) 15deg);
      background-attachment:fixed;
      display:flex; justify-content:center; align-items:flex-start;
      padding:18px 14px 40px;
    }
    .wrap{ width:100%; max-width:620px; }

    .glass{
      background:var(--glass);
      -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
      border:1px solid var(--glass-border); border-radius:16px;
      box-shadow:0 6px 20px rgba(0,0,0,0.22);
    }

    /* Top bar: back (top-left), right-aligned title */
    .topbar{ position:relative; display:flex; align-items:center; min-height:42px; margin-bottom:18px; }
    /* Matches the dashboard's red sign-out pill exactly */
    .back{
      position:absolute; top:0; left:0; display:inline-flex; align-items:center; gap:6px;
      padding:7px 11px; font-size:13px; font-weight:700; color:#fff; cursor:pointer;
      font-family:var(--font); background:#E8472A; border:1.5px solid #fff; border-radius:16px;
    }
    .back:active{ transform:scale(0.97); }
    .back svg{ width:16px; height:16px; flex:0 0 auto; }
    .page-title{ width:100%; text-align:right; font-size:23px; font-weight:800; color:#000; text-decoration:underline; }

    /* Question cards */
    .qcard{ padding:16px; margin-bottom:14px; }
    .qmeta{ display:flex; justify-content:space-between; gap:8px 14px; flex-wrap:wrap; font-size:12px; font-weight:700; opacity:0.92; margin-bottom:10px; }
    .qmeta .count{ color:#ff6a52; }
    .qbadges{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
    .badge{ font-size:11px; font-weight:800; padding:3px 9px; border-radius:999px; border:1.5px solid #fff; white-space:nowrap; background:rgba(255,255,255,0.14); }
    .badge-inactive{ background:var(--red); }
    .qtext{ font-size:17px; font-weight:800; line-height:1.5; margin-bottom:12px; }

    /* Image review — one generic frame for all four image folders (flags/crests/anime/cartoons).
       Admin judgment doesn't need the gameplay UI's per-folder aspect toggling — object-fit:contain
       inside a fixed max-height reads correctly regardless of the source image's own aspect ratio. */
    .review-image{ display:block; width:100%; max-height:220px; object-fit:contain; border-radius:10px;
      background:rgba(255,255,255,0.08); margin-bottom:12px; }

    .opts{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
    .opt{ padding:9px 12px; border-radius:10px; background:rgba(255,255,255,0.10); border:1px solid rgba(255,255,255,0.18); font-size:14px; font-weight:600; display:flex; align-items:center; gap:8px; }
    .opt.correct{ background:rgba(47,158,68,0.35); border-color:#fff; }
    .opt .tick{ width:18px; height:18px; flex:0 0 auto; }
    .opt .tick.hidden{ visibility:hidden; }

    /* flex-wrap so 3-4 buttons reflow instead of squeezing on narrow screens — same
       pattern already used by admin-players.html's .uactions. */
    .actions{ display:flex; flex-wrap:wrap; gap:9px; }
    .btn{ flex:1 1 0; min-width:110px; padding:10px 8px; border-radius:10px; border:1.5px solid #fff; color:#fff; font-size:13.5px; font-weight:800; font-family:var(--font); cursor:pointer; text-align:center; }
    .btn:active{ transform:scale(0.98); }
    .btn-edit{ background:var(--blue); }
    .btn-del{ background:var(--red); }
    .btn-keep{ background:var(--green); }
    .btn-save{ background:var(--green); }
    .btn-cancel{ background:var(--red); }
    .btn-deactivate{ background:var(--orange); }
    .btn-reactivate{ background:var(--green); }

    /* Edit mode */
    .edit-field{ margin-bottom:10px; }
    .edit-label{ font-size:12.5px; font-weight:700; opacity:0.9; margin-bottom:5px; }
    .edit-q{ width:100%; min-height:70px; resize:vertical; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,0.3); background:rgba(0,0,0,0.25); color:#fff; font-size:15px; font-family:var(--font); line-height:1.5; }
    .edit-opt-row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
    .edit-opt-row input[type=text]{ flex:1 1 auto; padding:9px 11px; border-radius:10px; border:1px solid rgba(255,255,255,0.3); background:rgba(0,0,0,0.25); color:#fff; font-size:14px; font-family:var(--font); }
    .edit-opt-row label{ font-size:12px; font-weight:700; opacity:0.9; display:inline-flex; align-items:center; gap:4px; white-space:nowrap; cursor:pointer; }
    .reason-input{ width:100%; min-height:54px; resize:vertical; padding:10px 12px; border-radius:10px;
      border:1px solid rgba(255,255,255,0.3); background:rgba(0,0,0,0.25); color:#fff; font-size:14px;
      font-family:var(--font); }
    .reason-input::placeholder{ color:rgba(255,255,255,0.7); }

    /* Confirmation modal (deactivate/reactivate) — same shape as admin-players.html's */
    .modal-overlay{ position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
      padding:20px; background:rgba(0,0,0,0.55); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); }
    .modal-card{ width:100%; max-width:340px; padding:22px 20px; text-align:center; }
    .modal-msg{ font-size:16px; font-weight:800; line-height:1.55; margin-bottom:14px; }
    .modal-actions{ display:flex; gap:10px; margin-top:14px; }
    .mbtn{ flex:1 1 0; min-width:0; padding:11px 10px; border-radius:11px; border:1.5px solid #fff; color:#fff;
      font-size:14.5px; font-weight:800; font-family:var(--font); cursor:pointer; }
    .mbtn:active{ transform:scale(0.98); }
    .mbtn-ok{ background:var(--orange); }
    .mbtn-cancel{ background:rgba(255,255,255,0.16); }

    /* States */
    #loading, #denied, #empty{ min-height:60vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; }
    #loading .l-txt{ font-weight:700; font-size:16px; }
    #denied .big, #empty .big{ font-size:21px; font-weight:800; }
    #denied .sub{ font-size:14px; opacity:0.9; max-width:300px; }
    .statebtn{ padding:10px 22px; font-size:15px; font-weight:700; color:#fff; cursor:pointer; font-family:var(--font); background:var(--blue); border:1.5px solid #fff; }
    .spinner{ width:42px; height:42px; border:4px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; animation:spin 0.8s linear infinite; }
    @keyframes spin{ to{ transform:rotate(360deg); } }
  </style>
</head>
<body>

  <!-- LOADING (default) -->
  <div id="loading"><div class="spinner"></div><div class="l-txt">جاري التحميل...</div></div>

  <!-- ACCESS DENIED -->
  <div id="denied" style="display:none;">
    <div class="big">✗ لا تملك صلاحية الدخول</div>
    <div class="sub">يجب تسجيل الدخول بحساب مشرف لعرض هذه الصفحة.</div>
    <button class="statebtn" type="button" onclick="goHome()">العودة للرئيسية</button>
  </div>

  <!-- SERVER ERROR (network failure / 500 / timeout — NOT a permission problem) -->
  <div id="error" style="display:none;">
    <div class="big">⚠ تعذّر الاتصال بالخادم</div>
    <div class="sub">حدث خطأ في الاتصال بالخادم. تحقق من الاتصال وحاول مرة أخرى.</div>
    <button class="statebtn" type="button" onclick="init()">إعادة المحاولة</button>
  </div>

  <!-- EMPTY STATE -->
  <div id="empty" class="wrap" style="display:none;">
    <div class="topbar">
      <button class="back" type="button" onclick="goDash()" aria-label="رجوع">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span>رجوع</span>
      </button>
      <div class="page-title">الأسئلة المُبلغ عنها</div>
    </div>
    <div class="glass" style="padding:40px 16px; text-align:center; font-size:18px; font-weight:800;">لا توجد أسئلة مُبلغ عنها حالياً</div>
  </div>

  <!-- LIST -->
  <div id="list-screen" class="wrap" style="display:none;">
    <div class="topbar">
      <button class="back" type="button" onclick="goDash()" aria-label="رجوع">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span>رجوع</span>
      </button>
      <div class="page-title">الأسئلة المُبلغ عنها</div>
    </div>
    <div id="list"></div>
  </div>

  <!-- Deactivate/reactivate confirmation modal -->
  <div id="confirm-modal" class="modal-overlay" style="display:none;" aria-hidden="true">
    <div class="modal-card glass" role="dialog" aria-modal="true">
      <div class="modal-msg" id="confirm-msg"></div>
      <textarea id="confirm-reason" class="reason-input" maxlength="500" placeholder="السبب (مطلوب)..." rows="2"></textarea>
      <div class="modal-actions">
        <button id="confirm-ok" class="mbtn mbtn-ok" type="button">تأكيد</button>
        <button id="confirm-cancel" class="mbtn mbtn-cancel" type="button">إلغاء</button>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    let flags = [];
    const DIFF_AR = { easy:'سهل', medium:'متوسط', hard:'صعب' };

    function goHome(){ location.href = '/'; }
    function goDash(){ location.href = '/admin.html'; }
    function showOnly(id){
      ['loading','denied','error','empty','list-screen'].forEach(s=>{
        document.getElementById(s).style.display = (s===id) ? (s==='loading'||s==='denied'||s==='error' ? 'flex' : 'block') : 'none';
      });
    }
    const ar = (v)=> (v==null ? 0 : v).toLocaleString('ar');

    function fmtDate(ts){
      try { return new Date(ts).toLocaleString('ar', { dateStyle:'medium', timeStyle:'short' }); }
      catch(e){ return ''; }
    }
    // Small helper: create an element with optional class and text (text set safely).
    function el(tag, cls, text){
      const e = document.createElement(tag);
      if(cls) e.className = cls;
      if(text != null) e.textContent = text;
      return e;
    }
    const checkSVG = '<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

    // ---- Reusable confirm modal (deactivate/reactivate — the only actions here that need a reason via a modal; edit collects its own reason inline) ----
    let _confirmCb = null;
    function showConfirm(message, onConfirm, opts){
      opts = opts || {};
      document.getElementById('confirm-msg').textContent = message;
      document.getElementById('confirm-reason').value = '';
      const ok = document.getElementById('confirm-ok');
      ok.textContent = opts.confirmText || 'تأكيد';
      _confirmCb = onConfirm;
      const overlay = document.getElementById('confirm-modal');
      overlay.style.display = 'flex'; overlay.setAttribute('aria-hidden','false');
    }
    function hideConfirm(){
      const overlay = document.getElementById('confirm-modal');
      overlay.style.display = 'none'; overlay.setAttribute('aria-hidden','true');
      _confirmCb = null;
    }
    document.getElementById('confirm-ok').addEventListener('click', ()=>{
      const reasonEl = document.getElementById('confirm-reason');
      const reason = reasonEl.value.trim();
      if(!reason){ alert('السبب مطلوب'); reasonEl.focus(); return; }
      const cb = _confirmCb; hideConfirm(); if(cb) cb(reason);
    });
    document.getElementById('confirm-cancel').addEventListener('click', hideConfirm);
    document.getElementById('confirm-modal').addEventListener('click', (e)=>{
      if(e.target.id === 'confirm-modal') hideConfirm();
    });

    function render(){
      const wrap = document.getElementById('list');
      wrap.innerHTML = '';
      if(!flags.length){ showOnly('empty'); return; }
      showOnly('list-screen');
      flags.forEach(f => wrap.appendChild(viewCard(f)));
    }

    function findCard(questionId){ return document.querySelector(`.qcard[data-id="${questionId}"]`); }

    // ---- View card ----
    function viewCard(f){
      const card = el('div','qcard glass');
      card.dataset.id = f.question_id;
      const isImage = f.image_url != null;

      const badges = el('div','qbadges');
      badges.appendChild(el('span','badge', f.category));
      badges.appendChild(el('span','badge', DIFF_AR[f.difficulty] || f.difficulty));
      badges.appendChild(el('span','badge', 'رقم السؤال: ' + ar(f.question_id)));
      if(!f.active) badges.appendChild(el('span','badge badge-inactive','معطّل'));
      card.appendChild(badges);

      const meta = el('div','qmeta');
      meta.appendChild(el('span','count', 'عدد البلاغات: ' + ar(f.report_count)));
      meta.appendChild(el('span', null, fmtDate(f.first_reported)));
      card.appendChild(meta);

      card.appendChild(el('div','qtext', f.question || '—'));

      if(isImage){
        const img = document.createElement('img');
        img.className = 'review-image';
        img.src = f.image_url;
        img.alt = f.question || '';
        card.appendChild(img);
      }

      // Answer + three distractors, in the RAW stored order (choice1..4) — never the
      // gameplay-shuffled order. This is load-bearing for the edit form's answer_index
      // (position IS the master-format letter), and correct for review either way.
      const opts = el('div','opts');
      (f.choices || []).forEach(o=>{
        const isCorrect = f.answer != null && o === f.answer;
        const row = el('div', 'opt' + (isCorrect ? ' correct' : ''));
        const tick = document.createElement('span');
        tick.innerHTML = checkSVG;
        const svg = tick.firstChild;
        if(!isCorrect) svg.classList.add('hidden');
        row.appendChild(svg);
        row.appendChild(el('span', null, o));
        opts.appendChild(row);
      });
      card.appendChild(opts);

      const actions = el('div','actions');
      if(!isImage){
        const editBtn = el('button','btn btn-edit','تعديل');
        editBtn.onclick = ()=> card.replaceWith(editCard(f));
        actions.appendChild(editBtn);
      }
      if(f.active){
        const deactBtn = el('button','btn btn-deactivate','تعطيل');
        deactBtn.onclick = ()=> onDeactivate(f, card);
        actions.appendChild(deactBtn);
      } else {
        const reactBtn = el('button','btn btn-reactivate','إعادة تفعيل');
        reactBtn.onclick = ()=> onReactivate(f, card);
        actions.appendChild(reactBtn);
      }
      const delBtn = el('button','btn btn-del','تجاهل البلاغ');
      delBtn.onclick = ()=> onDismiss(f, card);
      actions.appendChild(delBtn);
      const keepBtn = el('button','btn btn-keep','لا يوجد خطأ');
      keepBtn.onclick = ()=> onKeep(f, card);
      actions.appendChild(keepBtn);
      card.appendChild(actions);

      return card;
    }

    // ---- Edit card (text rows only — never reachable for image rows) ----
    function editCard(f){
      const card = el('div','qcard glass');
      card.dataset.id = f.question_id;

      const qf = el('div','edit-field');
      qf.appendChild(el('div','edit-label','نص السؤال'));
      const qta = el('textarea','edit-q');
      qta.value = f.question || '';
      qf.appendChild(qta);
      card.appendChild(qf);

      const of = el('div','edit-field');
      of.appendChild(el('div','edit-label','الخيارات (حدد الإجابة الصحيحة)'));
      const optInputs = [];
      const radioName = 'correct-' + f.question_id;
      const baseOpts = (f.choices && f.choices.length === 4) ? f.choices : ['','','',''];
      baseOpts.forEach((o, idx)=>{
        const row = el('div','edit-opt-row');
        const inp = el('input'); inp.type='text'; inp.value = o;
        const radioLabel = el('label');
        const radio = el('input'); radio.type='radio'; radio.name = radioName; radio.value = idx;
        if(f.answer != null && o === f.answer) radio.checked = true;
        radioLabel.appendChild(radio);
        radioLabel.appendChild(el('span', null, 'صحيحة'));
        row.appendChild(inp);
        row.appendChild(radioLabel);
        of.appendChild(row);
        optInputs.push({ inp, radio });
      });
      card.appendChild(of);

      const rf = el('div','edit-field');
      rf.appendChild(el('div','edit-label','سبب التعديل'));
      const reasonTa = el('textarea','reason-input');
      reasonTa.maxLength = 500;
      reasonTa.placeholder = 'السبب (مطلوب)...';
      reasonTa.rows = 2;
      rf.appendChild(reasonTa);
      card.appendChild(rf);

      const actions = el('div','actions');
      actions.style.marginTop = '12px';
      const saveBtn = el('button','btn btn-save','حفظ');
      saveBtn.onclick = ()=>{
        const question = qta.value.trim();
        if(!question){ alert('نص السؤال مطلوب'); return; }
        const choiceVals = optInputs.map(x=> x.inp.value.trim());
        if(choiceVals.some(v=> !v.length)){ alert('كل الخيارات مطلوبة'); return; }
        const chosen = optInputs.find(x=> x.radio.checked);
        if(!chosen){ alert('حدد الإجابة الصحيحة'); return; }
        const reason = reasonTa.value.trim();
        if(!reason){ alert('السبب مطلوب'); return; }
        onSave(f, {
          question,
          choice1: choiceVals[0], choice2: choiceVals[1], choice3: choiceVals[2], choice4: choiceVals[3],
          answer_index: parseInt(chosen.radio.value, 10),
          reason
        }, card);
      };
      const cancelBtn = el('button','btn btn-cancel','إلغاء');
      cancelBtn.onclick = ()=> card.replaceWith(viewCard(f));
      actions.appendChild(saveBtn);
      actions.appendChild(cancelBtn);
      card.appendChild(actions);

      return card;
    }

    // ---- Actions ----
    async function onSave(f, payload, card){
      try{
        const res = await fetch('/api/admin/questions/' + f.question_id, {
          method:'PUT',
          headers:{ 'Content-Type':'application/json', Authorization:'Bearer ' + token },
          body: JSON.stringify(payload)
        });
        const d = await res.json().catch(()=> ({}));
        if(!res.ok){ alert(d.error || 'تعذّر الحفظ، حاول مجدداً'); return; }
        flags = flags.filter(x=> x.question_id !== f.question_id);   // fixed -> leaves pending list
        render();
      }catch(e){ alert('تعذّر الحفظ، حاول مجدداً'); }
    }

    // Dismiss a report (the report was bad) — resolves it, leaves the question untouched.
    async function onDismiss(f, card){
      if(!confirm('تجاهل هذا البلاغ؟')) return;
      try{
        const res = await fetch('/api/admin/flags/' + f.question_id + '/dismiss', {
          method:'POST', headers:{ Authorization:'Bearer ' + token }
        });
        if(!res.ok){ alert('تعذّر الحفظ، حاول مجدداً'); return; }
        flags = flags.filter(x=> x.question_id !== f.question_id);
        render();
      }catch(e){ alert('تعذّر الحفظ، حاول مجدداً'); }
    }

    // "لا مشكلة" — the reported question is actually fine. Resolves the report,
    // leaves the question snapshot completely unchanged.
    async function onKeep(f, card){
      try{
        const res = await fetch('/api/admin/flags/' + f.question_id + '/keep', {
          method:'POST', headers:{ Authorization:'Bearer ' + token }
        });
        if(!res.ok){ alert('تعذّر الحفظ، حاول مجدداً'); return; }
        flags = flags.filter(x=> x.question_id !== f.question_id);
        render();
      }catch(e){ alert('تعذّر الحفظ، حاول مجدداً'); }
    }

    // Deactivate/reactivate does NOT resolve the flag report and does NOT remove the
    // card from the pending list — it's an independent rotation control, not a fix.
    // Only that one card's active-state is updated in place.
    async function onDeactivate(f, card){
      let msg = 'تعطيل هذا السؤال؟ سيتوقف عن الظهور في الجولات.';
      try{
        const cRes = await fetch('/api/admin/questions/active-count?category=' + encodeURIComponent(f.category) + '&difficulty=' + encodeURIComponent(f.difficulty), { headers:{ Authorization:'Bearer ' + token } });
        if(cRes.ok){
          const { count } = await cRes.json();
          msg = `تعطيل هذا السؤال؟ فئة «${f.category}» صعوبة «${DIFF_AR[f.difficulty]||f.difficulty}» لديها حالياً ${ar(count)} سؤال نشط — سيتبقى ${ar(Math.max(0,count-1))} بعد التعطيل.`;
        }
      }catch(e){ /* count is informational only — proceed with the generic message if it fails */ }

      showConfirm(msg, async (reason)=>{
        try{
          const res = await fetch('/api/admin/questions/' + f.question_id + '/deactivate', {
            method:'POST', headers:{ 'Content-Type':'application/json', Authorization:'Bearer ' + token },
            body: JSON.stringify({ reason })
          });
          const d = await res.json().catch(()=> ({}));
          if(!res.ok){ alert(d.error || 'تعذّرت العملية'); return; }
          f.active = false;
          const cur = findCard(f.question_id);
          if(cur) cur.replaceWith(viewCard(f));
        }catch(e){ alert('تعذّرت العملية، حاول مجدداً'); }
      }, { confirmText:'تعطيل' });
    }

    async function onReactivate(f, card){
      showConfirm('إعادة تفعيل هذا السؤال؟ سيعود للظهور في الجولات.', async (reason)=>{
        try{
          const res = await fetch('/api/admin/questions/' + f.question_id + '/reactivate', {
            method:'POST', headers:{ 'Content-Type':'application/json', Authorization:'Bearer ' + token },
            body: JSON.stringify({ reason })
          });
          const d = await res.json().catch(()=> ({}));
          if(!res.ok){ alert(d.error || 'تعذّرت العملية'); return; }
          f.active = true;
          const cur = findCard(f.question_id);
          if(cur) cur.replaceWith(viewCard(f));
        }catch(e){ alert('تعذّرت العملية، حاول مجدداً'); }
      }, { confirmText:'إعادة تفعيل' });
    }

    // ---- Load ----
    async function init(){
      if(!token){ showOnly('denied'); return; }
      try{
        const res = await fetch('/api/admin/flags', { headers:{ Authorization:'Bearer ' + token } });
        if(res.status === 401 || res.status === 403){ showOnly('denied'); return; }   // real permission denial
        if(!res.ok){ showOnly('error'); return; }   // 500 / other server failure — not a permission problem
        const d = await res.json().catch(()=> ({}));
        flags = Array.isArray(d.flags) ? d.flags : [];
        render();
      }catch(e){ showOnly('error'); }   // network failure/timeout — not a permission problem
    }
    init();
  </script>
</body>
</html>
